version: 2.1

orbs:
  ruby: circleci/ruby@3.0.0

executors:
  default:
    docker:
      - image: cimg/ruby:4.0.9

jobs:
  rubocop:
    executor: default
    steps:
      - checkout
      - ruby/install-deps
      - ruby/rubocop-check

  rspec:
    executor: default
    steps:
      - checkout
      - attach_workspace:
          at: .
      - ruby/install-deps
      - ruby/rspec-test

workflows:
  version: 2.1
  build:
    jobs:
      - rubocop
      - rspec
